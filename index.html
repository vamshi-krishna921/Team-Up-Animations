<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animation Preview — Team Up</title>
  <meta name="description"
    content="Interactive animation preview with contextual Flutter JSON export for mobile apps." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- ===== LEFT SIDEBAR: Animation List ===== -->
    <aside class="sidebar">
      <div class="sb-header">
        <div class="sb-logo">
          <span class="sb-star">✦</span>
          <div class="sb-titles">
            <span class="sb-name">Up-Studio</span>
            <span class="sb-tagline">Animations</span>
          </div>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
          <svg class="sun-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="moon-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
      <div class="sb-sep"></div>
      <div class="sb-section-lbl">25 ANIMATIONS</div>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search animations..." class="search-input" />
      </div>
      <nav class="sb-nav">
        <button class="sb-item" data-name="Slide Up" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#667eea,#764ba2)">⬆</div>
          <div class="sb-meta"><span class="sb-iname">Slide Up</span><span class="sb-tag t-pos">Position</span></div>
        </button>
        <button class="sb-item" data-name="Slide Down" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#764ba2,#667eea)">⬇</div>
          <div class="sb-meta"><span class="sb-iname">Slide Down</span><span class="sb-tag t-pos">Position</span></div>
        </button>
        <button class="sb-item" data-name="Spin" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c)">⟳</div>
          <div class="sb-meta"><span class="sb-iname">Spin</span><span class="sb-tag t-rot">Rotation</span></div>
        </button>
        <button class="sb-item" data-name="Card Flip" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">🃏</div>
          <div class="sb-meta"><span class="sb-iname">Card Flip</span><span class="sb-tag t-3d">3D</span></div>
        </button>
        <button class="sb-item" data-name="Wobble" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">〰</div>
          <div class="sb-meta"><span class="sb-iname">Wobble</span><span class="sb-tag t-tfm">Transform</span></div>
        </button>
        <button class="sb-item" data-name="Sidebar Collapse" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#fa709a,#fee140)">◀</div>
          <div class="sb-meta"><span class="sb-iname">Sidebar Collapse</span><span class="sb-tag t-lay">Layout</span>
          </div>
        </button>
        <button class="sb-item" data-name="Navigation Bar Slide" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#a18cd1,#fbc2eb)">📌</div>
          <div class="sb-meta"><span class="sb-iname">Nav Bar Slide</span><span class="sb-tag t-pos">Position</span>
          </div>
        </button>
        <button class="sb-item" data-name="Menu Reveal" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#ffecd2,#fcb69f)">☰</div>
          <div class="sb-meta"><span class="sb-iname">Menu Reveal</span><span class="sb-tag t-rev">Reveal</span></div>
        </button>
        <button class="sb-item" data-name="Image Reveal" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#a1c4fd,#c2e9fb)">🖼</div>
          <div class="sb-meta"><span class="sb-iname">Image Reveal</span><span class="sb-tag t-flt">Filter</span></div>
        </button>
        <button class="sb-item" data-name="Text Reveal" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#d4fc79,#96e6a1)">Aa</div>
          <div class="sb-meta"><span class="sb-iname">Text Reveal</span><span class="sb-tag t-typ">Type</span></div>
        </button>
        <button class="sb-item" data-name="Card Pop" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#ff9a9e,#fecfef)">💥</div>
          <div class="sb-meta"><span class="sb-iname">Card Pop</span><span class="sb-tag t-scl">Scale</span></div>
        </button>
        <button class="sb-item" data-name="Fade In" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#30cfd0,#667eea)">◎</div>
          <div class="sb-meta"><span class="sb-iname">Fade In</span><span class="sb-tag t-opc">Opacity</span></div>
        </button>
        <button class="sb-item" data-name="Bounce" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#f7971e,#ffd200)">○</div>
          <div class="sb-meta"><span class="sb-iname">Bounce</span><span class="sb-tag t-pos">Position</span></div>
        </button>
        <button class="sb-item" data-name="Pulse" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#ee0979,#ff6a00)">♥</div>
          <div class="sb-meta"><span class="sb-iname">Pulse</span><span class="sb-tag t-scl">Scale</span></div>
        </button>
        <button class="sb-item" data-name="Shake" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#373b44,#4286f4)">⚡</div>
          <div class="sb-meta"><span class="sb-iname">Shake</span><span class="sb-tag t-tfm">Transform</span></div>
        </button>
        <button class="sb-item" data-name="Shimmer" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#e2e8f0,#cbd5e1)">✨</div>
          <div class="sb-meta"><span class="sb-iname">Shimmer</span><span class="sb-tag t-flt">Filter</span></div>
        </button>
        <button class="sb-item" data-name="Glitch" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#00f2fe,#4facfe)">👾</div>
          <div class="sb-meta"><span class="sb-iname">Glitch</span><span class="sb-tag t-tfm">Transform</span></div>
        </button>
        <button class="sb-item" data-name="Liquid Float" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#abecd6,#fbed96)">🫧</div>
          <div class="sb-meta"><span class="sb-iname">Liquid Float</span><span class="sb-tag t-pos">Position</span>
          </div>
        </button>
        <button class="sb-item" data-name="3D Tilt" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#f857a6,#ff5858)">📐</div>
          <div class="sb-meta"><span class="sb-iname">3D Tilt</span><span class="sb-tag t-3d">3D</span></div>
        </button>
        <button class="sb-item" data-name="Staggered Wave" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#30cfd0,#330867)">🌊</div>
          <div class="sb-meta"><span class="sb-iname">Staggered Wave</span><span class="sb-tag t-tfm">Transform</span>
          </div>
        </button>
        <button class="sb-item" data-name="Neon Glow" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#ff007f,#ff00ff)">🚨</div>
          <div class="sb-meta"><span class="sb-iname">Neon Glow</span><span class="sb-tag t-flt">Filter</span></div>
        </button>
        <button class="sb-item" data-name="Elastic Slide" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#f59e0b,#ee0979)">🏹</div>
          <div class="sb-meta"><span class="sb-iname">Elastic Slide</span><span class="sb-tag t-pos">Position</span>
          </div>
        </button>
        <button class="sb-item" data-name="Reveal Zoom" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#10b981,#059669)">🔍</div>
          <div class="sb-meta"><span class="sb-iname">Reveal Zoom</span><span class="sb-tag t-rev">Reveal</span></div>
        </button>
        <button class="sb-item" data-name="Like Burst" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#ff0844,#ffb199)">❤️</div>
          <div class="sb-meta"><span class="sb-iname">Like Burst</span><span class="sb-tag t-scl">Scale</span></div>
        </button>
        <button class="sb-item" data-name="Fly to Wishlist" aria-pressed="false">
          <div class="sb-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c)">🎈</div>
          <div class="sb-meta"><span class="sb-iname">Fly to Wishlist</span><span class="sb-tag t-pos">Position</span>
          </div>
        </button>
      </nav>
    </aside>

    <!-- ===== RIGHT MAIN: Big Preview + Controls + Export ===== -->
    <main class="main-content">

      <!-- Preview Stage (large) -->
      <div class="preview-stage" id="previewStage">
        <div class="stage-grid"></div>
        <div class="stage-topbar">
          <span class="stage-lbl">PREVIEW</span>
          <span class="stage-anim-name" id="stageAnimName">—</span>
          <div class="stage-actions">
            <button class="stage-device-toggle" id="deviceToggleBtn" aria-label="Toggle Mobile Layout">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                <line x1="12" y1="18" x2="12.01" y2="18" />
              </svg>
              <span>Test Mobile</span>
            </button>
            <button class="stage-replay" id="replayBtn" aria-label="Replay animation">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 .49-3.5" />
              </svg>
              Replay
            </button>
          </div>
        </div>
        <!-- Empty State -->
        <div class="stage-empty" id="stageEmpty">
          <div class="empty-ring er1"></div>
          <div class="empty-ring er2"></div>
          <div class="empty-icon-lbl">✦</div>
          <p class="empty-title">Select an animation</p>
          <p class="empty-hint">Choose one from the sidebar to preview &amp; export</p>
        </div>
        <!-- Dynamic animation content -->
        <div class="stage-scene" id="stageScene"></div>
      </div>

      <!-- Bottom Panel: Controls + Export -->
      <div class="bottom-panel">
        <!-- Controls -->
        <div class="bp-col controls-col">
          <div class="bp-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2.5"
              stroke-linecap="round">
              <path d="M12 20V10" />
              <path d="M18 20V4" />
              <path d="M6 20v-4" />
            </svg>
            Controls
          </div>
          <div class="ctrl-grid">
            <div class="ctrl-item">
              <span class="ctrl-lbl">Duration</span>
              <input type="range" id="durationSlider" min="100" max="3000" step="50" value="800" />
              <span class="ctrl-val" id="durationVal">0.8s</span>
            </div>
            <div class="ctrl-item">
              <span class="ctrl-lbl">Delay</span>
              <input type="range" id="delaySlider" min="0" max="2000" step="50" value="0" />
              <span class="ctrl-val" id="delayVal">0s</span>
            </div>
            <div class="ctrl-item">
              <span class="ctrl-lbl">Easing</span>
              <select id="easingSelect" class="ctrl-sel">
                <option value="cubic-bezier(0.22,1,0.36,1)">Ease Out Expo</option>
                <option value="linear">Linear</option>
                <option value="ease">Ease</option>
                <option value="ease-in">Ease In</option>
                <option value="ease-out">Ease Out</option>
                <option value="ease-in-out">Ease In Out</option>
                <option value="cubic-bezier(0.34,1.56,0.64,1)">Spring Bounce</option>
                <option value="cubic-bezier(0.4,0,0.2,1)">Material</option>
              </select>
            </div>
            <div class="ctrl-item">
              <span class="ctrl-lbl">Direction</span>
              <select id="directionSelect" class="ctrl-sel">
                <option value="normal">Normal</option>
                <option value="reverse">Reverse</option>
                <option value="alternate">Alternate</option>
                <option value="alternate-reverse">Alt. Reverse</option>
              </select>
            </div>
            <div class="ctrl-item">
              <span class="ctrl-lbl">Fill Mode</span>
              <select id="fillSelect" class="ctrl-sel">
                <option value="forwards">Forwards</option>
                <option value="backwards">Backwards</option>
                <option value="both">Both</option>
                <option value="none">None</option>
              </select>
            </div>
            <div class="ctrl-item">
              <span class="ctrl-lbl">Iterations</span>
              <div class="iter-ctrl">
                <button class="iter-btn" id="iterMinus" aria-label="Decrease">−</button>
                <span class="iter-num" id="iterVal">1</span>
                <button class="iter-btn" id="iterPlus" aria-label="Increase">+</button>
                <label class="inf-toggle">
                  <input type="checkbox" id="infiniteToggle" />
                  <span class="inf-track"><span class="inf-thumb"></span></span>
                  <span class="inf-lbl">∞</span>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="bp-divider"></div>
        <!-- Export -->
        <div class="bp-col export-col">
          <div class="bp-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span style="color:#38bdf8">Export for Flutter</span>
          </div>
          <pre class="json-block" id="jsonPreview">// Select an animation
// to generate JSON</pre>
          <div class="export-btns">
            <button class="ebtn ebtn-copy" id="copyBtn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              Copy JSON
            </button>
            <button class="ebtn ebtn-dl" id="downloadBtn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Download
            </button>
          </div>
          <div class="copy-toast" id="copyToast">✓ Copied!</div>
        </div>
      </div>

    </main>
  </div>
  <script src="script.js"></script>
</body>

</html>
